name: Save top 12 rankings
on:
  push:
    branches: [main]
    paths: ['scripts/rankings.cjs', '.github/workflows/rankings.yml']
  issues:
    types: [opened, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: rankings
  cancel-in-progress: false
jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const update = require('./scripts/rankings.cjs');
            await update({github, context});
