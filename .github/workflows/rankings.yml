name: Save top 12 rankings
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: ['scripts/sync-rankings.cjs', 'data/rankings-config.json', '.github/workflows/rankings.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rankings
  cancel-in-progress: false
jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/sync-rankings.cjs')({github,context});
